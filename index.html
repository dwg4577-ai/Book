<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#f6f1e7" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="책책책" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <title>책책책 📖</title>
<style>
    :root{
      --bg:#ffffff;
      --ink:#252525;
      --muted:#8a8a8a;
      --card:#ffffff;
      --line:#e8e8e8;
      --accent:#a9d8f4;
      --accent-deep:#70b8e4;
      --accent-soft:#eef8fe;
      --shadow:0 10px 30px rgba(40,70,90,.08);
    }
    *{box-sizing:border-box;min-width:0}
    html,body{margin:0;width:100%;height:100%;max-width:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
    body{position:fixed;inset:0;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);touch-action:manipulation}
    button,input,textarea{font:inherit}
    button{-webkit-tap-highlight-color:transparent}
    .app{width:100%;max-width:680px;height:100%;margin:0 auto;padding:14px 16px calc(88px + env(safe-area-inset-bottom));overflow:hidden;display:flex;flex-direction:column}
    header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:14px;flex:0 0 auto}
    h1{font-size:29px;line-height:1.15;margin:0;font-weight:850;letter-spacing:-.035em}.title-emoji{font-family:Apple Color Emoji,"Segoe UI Emoji",sans-serif;font-size:.72em}
    .sub{margin-top:7px;font-size:13px;color:var(--muted)}
    .count{font-size:13px;color:#4b5963;white-space:nowrap;font-weight:800}.count.total{font-size:11px;color:var(--muted);font-weight:600}.count-wrap{display:flex;flex-direction:column;align-items:flex-end;gap:2px}.header-actions{display:flex;align-items:flex-start;gap:8px;padding-top:1px}
    .search-row{display:flex;gap:8px;margin-bottom:10px;flex:0 0 auto}
    .search-row input{flex:1}
    input,textarea{display:block;width:100%;max-width:100%;min-width:0;border:1px solid var(--line);background:white;border-radius:13px;padding:12px 13px;color:var(--ink);outline:none;font-size:16px;-webkit-appearance:none;appearance:none}
    textarea{resize:vertical;min-height:110px;line-height:1.55}
    input:focus,textarea:focus{border-color:#a99d8c}
    .search-btn,.mini-btn{border:0;border-radius:14px;background:var(--accent);color:#26475c;font-weight:800;padding:0 15px;cursor:pointer}
    .search-results{display:none;background:#fff;border:1px solid var(--line);border-radius:18px;margin:0 0 12px;overflow-y:auto;overflow-x:hidden;max-height:48vh;min-height:0;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;flex:0 1 auto}
    .search-results.open{display:block}
    .result{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;border:0;background:#fff;padding:15px 14px;border-bottom:1px solid #f0f1f2;cursor:pointer;color:inherit}
    .result:last-child{border-bottom:0}
    .result img{width:56px;aspect-ratio:2/3;object-fit:cover;border-radius:7px;background:#eee;flex:0 0 auto}
    .rtitle{font-weight:850;font-size:15px;line-height:1.4}
    .rmeta{font-size:12px;color:var(--muted);line-height:1.6;margin-top:5px}
    .result-note{padding:26px 16px;font-size:13px;color:var(--muted);text-align:center;line-height:1.6}
    .stack-shell{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;margin-top:8px}.stack-label{font-size:12px;font-weight:800;color:var(--muted);margin:0 2px 6px}.stack-viewport{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;border-radius:18px;background:#fff}.stack-wrap{min-height:100%;display:flex;align-items:flex-end;justify-content:center;padding:18px 4px 10px}
    .stack{width:100%;display:flex;flex-direction:column-reverse;align-items:center;gap:10px}
    .book{
      border:0;position:relative;display:flex;align-items:center;justify-content:center;
      padding:0 16px 0 24px;
      color:#fff;font-weight:800;letter-spacing:-.02em;cursor:pointer;overflow:hidden;
      box-shadow:0 5px 9px rgba(55,42,24,.13),0 1px 2px rgba(55,42,24,.10);
      isolation:isolate;background-size:cover;background-position:center center;
    }
    .book::before{
      content:"";position:absolute;inset:0;border-radius:inherit;z-index:0;
      background:linear-gradient(90deg,rgba(18,16,14,.20),rgba(255,255,255,.05) 18%,rgba(0,0,0,.08) 100%);
      pointer-events:none;
    }
    .book::after{
      content:"";position:absolute;left:6px;top:4px;bottom:4px;width:9px;border-radius:4px 2px 2px 4px;
      background:repeating-linear-gradient(to bottom,#fffdf7 0,#fffdf7 1px,#e9e2d5 2px,#fffdf7 3px);
      box-shadow:inset -2px 0 2px rgba(80,65,44,.12),1px 0 1px rgba(255,255,255,.65);
      pointer-events:none;z-index:2;
    }
    .book-title{
      z-index:3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:86%;
      font-size:13px;text-shadow:0 1px 3px rgba(0,0,0,.55);
      background:rgba(20,20,20,.22);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);
      padding:3px 9px;border-radius:999px;
    }
    .empty{margin:auto;text-align:center;color:var(--muted);padding:70px 20px}
    .empty strong{display:block;color:var(--ink);font-size:18px;margin-bottom:8px}
    .fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom));border:0;border-radius:999px;padding:15px 24px;background:var(--accent);color:#23465b;font-weight:850;box-shadow:0 10px 24px rgba(82,157,198,.20);cursor:pointer;z-index:20;white-space:nowrap}
    .sheet-bg{position:fixed;inset:0;background:rgba(22,18,13,.28);display:none;align-items:flex-end;justify-content:center;z-index:30}
    .sheet-bg.open{display:flex}
    .sheet{
      width:min(680px,100%);max-height:92vh;overflow:auto;background:var(--card);border-radius:24px 24px 0 0;
      padding:18px 18px calc(28px + env(safe-area-inset-bottom));box-shadow:var(--shadow)
    }
    .handle{width:46px;height:5px;background:#d5cec1;border-radius:9px;margin:0 auto 18px}
    .sheet h2{font-size:20px;margin:0 0 18px}
    .field{margin-bottom:14px}
    label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:7px}
    .grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;width:100%}.grid>*{min-width:0;max-width:100%}
    .actions{display:flex;gap:10px;margin-top:18px}
    .btn{flex:1;border:0;border-radius:13px;padding:13px 12px;font-weight:800;cursor:pointer}
    .btn.primary{background:var(--accent);color:#23465b}
    .btn.secondary{background:#f4f4f4;color:#555}
    .btn.danger{background:#f5e4e0;color:#9a3d2d}
    .hint{font-size:12px;color:var(--muted);margin:-4px 0 12px;line-height:1.45}
    .detail-head{display:flex;gap:14px;align-items:flex-start;margin-bottom:18px}
    .cover{width:76px;aspect-ratio:2/3;background:#eee6d8;border-radius:9px;object-fit:cover;box-shadow:0 6px 14px rgba(0,0,0,.14)}
    .detail-meta{flex:1}
    .detail-title{font-size:21px;font-weight:850;line-height:1.35;margin-bottom:7px}
    .meta{font-size:13px;color:var(--muted);line-height:1.6}
    .review-box{white-space:pre-wrap;line-height:1.7;background:#fafafa;border:1px solid #f0f0f0;border-radius:14px;padding:14px;margin-top:10px}
    .stars{letter-spacing:2px;color:#aa7d20}
    .rating-picker{display:flex;align-items:center;justify-content:center;gap:8px;min-height:64px;padding:10px 12px;border:1px solid var(--line);background:white;border-radius:15px;width:100%}
    .star-wrap{position:relative;width:40px;height:40px;flex:0 0 40px}
    .star-wrap button{position:absolute;top:0;bottom:0;width:50%;border:0;padding:0;margin:0;background:transparent;cursor:pointer;z-index:2}
    .star-wrap .half-left{left:0}.star-wrap .half-right{right:0}
    .star-bg,.star-fill{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:38px;line-height:1;pointer-events:none}
    .star-bg{color:#dddddd}
    .star-fill{color:#f4b942;width:100%;clip-path:inset(0 100% 0 0);-webkit-clip-path:inset(0 100% 0 0)}
    .rating-value{font-size:13px;color:var(--muted);white-space:nowrap;margin-left:6px;min-width:46px;text-align:center}
    @media(max-width:520px){.grid{grid-template-columns:1fr}.field{min-width:0}}
    
    
    .gear-btn{border:0;background:var(--accent-soft);color:#4d7891;width:36px;height:36px;border-radius:50%;font-size:19px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;margin-top:0}
    .section-card{background:#fafafa;border:1px solid #f0f0f0;border-radius:16px;padding:14px;margin-bottom:14px}
    .section-title{font-weight:850;font-size:15px;margin-bottom:8px}
    .section-text{font-size:12px;color:var(--muted);line-height:1.6}
    .settings-row{display:flex;gap:8px;align-items:center}
    .settings-row input{flex:1}
    .tiny{font-size:11px;color:var(--muted);line-height:1.5}
    .link-btn{display:inline-block;margin-top:8px;color:#5e5548;text-decoration:underline;font-size:12px}
    .status{font-size:12px;margin-top:8px;color:var(--muted)}
    .file-input{display:none}
    @media(max-width:420px){
      .app{padding-left:14px;padding-right:14px}
      .stack-wrap{min-height:100%}
      .book-title{font-size:13px}
    }
  
    @media(max-width:520px){
      header{align-items:flex-start}
      .app{padding-left:14px;padding-right:14px}
      .search-row{width:100%;grid-template-columns:1fr}
      .grid{grid-template-columns:1fr}
      .field{width:100%;max-width:100%}
      input[type="date"]{width:100%;max-width:100%;min-width:0}
      .rating-picker{width:100%;max-width:100%;gap:5px;overflow:hidden;justify-content:center}
      .star-wrap{width:34px;height:34px;flex:0 0 34px}
      .star-bg,.star-fill{font-size:32px}
      .rating-value{font-size:12px;min-width:42px}
      .sheet{width:100%;max-width:100%;padding-left:14px;padding-right:14px}
      .search-results{width:100%;max-width:100%}
    }

  
    .monthly-panel{flex:0 0 auto;margin-top:2px}.month-toggle{width:100%;border:0;background:transparent;padding:4px 2px 6px;display:flex;align-items:center;justify-content:space-between;color:#53616a;font-size:12px;font-weight:800;cursor:pointer}.monthly-section{flex:0 0 auto;margin-top:0}
    
    
    
    .month-scroll{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:2px 0 6px}
    .month-scroll::-webkit-scrollbar{display:none}
    .month-chart{display:flex;align-items:flex-end;gap:12px;min-width:max-content;padding:0 4px;height:116px}
    .month-col{width:58px;height:108px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
    .mini-stack{height:78px;width:54px;display:flex;flex-direction:column-reverse;justify-content:flex-start;align-items:center;gap:2px}
    .mini-book{height:6px;border-radius:4px;box-shadow:0 1px 2px rgba(0,0,0,.08)}
    .month-name{font-size:11px;color:#666;margin-top:5px}
    .month-num{font-size:10px;color:#9a9a9a;margin-top:1px}

  
    .stack-label-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 2px 6px}
    .stack-label-row .stack-label{margin:0}
    .history-btn{border:0;background:transparent;color:#64859a;font-size:11px;font-weight:800;padding:4px 2px;cursor:pointer}

    .detail-bg{
      position:fixed;inset:0;display:none;z-index:40;
      background:rgba(25,35,42,.20);
      padding:calc(env(safe-area-inset-top) + 70px) 14px calc(env(safe-area-inset-bottom) + 86px);
      align-items:stretch;justify-content:center;
    }
    .detail-bg.open{display:flex}
    .detail-card,.library-card{
      position:relative;width:100%;max-width:620px;min-height:0;
      background:#fff;border:1px solid #eceff1;border-radius:22px;
      box-shadow:0 18px 50px rgba(30,55,70,.14);
      overflow:hidden;
    }
    .detail-card{display:flex;flex-direction:column;padding:18px 16px 14px}
    .detail-close{
      position:absolute;right:12px;top:10px;width:30px;height:30px;border:0;border-radius:50%;
      background:#f4f6f7;color:#5d6970;font-size:22px;line-height:1;display:flex;align-items:center;justify-content:center;
      cursor:pointer;z-index:2
    }
    .detail-close.static{position:static;flex:0 0 auto}
    .detail-scroll{overflow-y:auto;min-height:0;padding:4px 28px 8px 0;-webkit-overflow-scrolling:touch}
    .detail-head{gap:12px;margin-bottom:12px}
    .detail-card .cover{width:62px;border-radius:8px}
    .detail-title{font-size:17px;font-weight:850;line-height:1.35;margin-bottom:5px}
    .meta{font-size:12px;line-height:1.55}
    .detail-card label{font-size:11px;margin-bottom:5px}
    .detail-card .review-box{font-size:13px;line-height:1.6;padding:11px 12px;border-radius:12px;margin-top:6px}
    .detail-card .stars{font-size:12px;letter-spacing:1px}
    .detail-actions{display:flex;justify-content:flex-end;gap:7px;padding-top:10px;border-top:1px solid #f0f2f3}
    .detail-btn{border:0;border-radius:10px;padding:8px 13px;font-size:12px;font-weight:800;cursor:pointer}
    .detail-btn.edit{background:var(--accent-soft);color:#4e7489}
    .detail-btn.delete{background:#faf1ef;color:#a65f53}

    .library-card{display:flex;flex-direction:column;padding:16px}
    .library-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding-right:2px}
    .library-title{font-size:17px;font-weight:850}
    .library-sub{font-size:11px;color:var(--muted);margin-top:3px}
    .library-search{margin-top:12px}
    .library-search input{font-size:16px;padding:10px 12px}
    .library-list{margin-top:10px;overflow-y:auto;min-height:0;-webkit-overflow-scrolling:touch}
    .history-item{width:100%;display:flex;align-items:center;gap:10px;border:0;background:#fff;padding:9px 4px;border-bottom:1px solid #f1f2f3;text-align:left;cursor:pointer}
    .history-item:last-child{border-bottom:0}
    .history-cover{width:38px;aspect-ratio:2/3;border-radius:5px;background:#eef1f2;object-fit:cover;flex:0 0 auto}
    .history-title{font-size:13px;font-weight:800;line-height:1.35}
    .history-meta{font-size:11px;color:var(--muted);margin-top:2px}
    .history-empty{padding:30px 10px;text-align:center;font-size:12px;color:var(--muted)}

    .month-col{border:0;background:transparent;padding:0;cursor:pointer}

  
    .reread-card{position:relative;width:100%;max-width:520px;align-self:center;background:#fff;border:1px solid #eceff1;border-radius:22px;padding:20px 16px 16px;box-shadow:0 18px 50px rgba(30,55,70,.14)}
    .reread-title{font-size:17px;font-weight:850;padding-right:36px}
    .reread-sub{font-size:12px;color:var(--muted);margin-top:4px}
    .reread-prev{margin-top:14px;max-height:220px;overflow-y:auto}
    .reread-prev-item{padding:10px 0;border-bottom:1px solid #f0f1f2}
    .reread-prev-item:last-child{border-bottom:0}
    .reread-prev-head{font-size:12px;font-weight:800}
    .reread-prev-review{font-size:12px;color:#626b70;line-height:1.5;margin-top:4px;white-space:pre-wrap}
    .reread-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
    .reread-history{background:#f7fbfd;border:1px solid #e5f1f7;border-radius:12px;padding:10px 12px;margin-bottom:14px}
    .reread-history-title{font-size:12px;font-weight:850;color:#53758a;margin-bottom:6px}
    .reread-history-item{font-size:11px;color:#65737b;line-height:1.5;padding:5px 0;border-top:1px solid #edf4f7}
    .library-tabs{display:flex;gap:6px;margin-top:12px}
    .lib-tab{border:0;border-radius:999px;padding:7px 11px;background:#f3f5f6;color:#657078;font-size:11px;font-weight:800;cursor:pointer}
    .lib-tab.active{background:var(--accent-soft);color:#50778d}

  </style>
</head>
<body>
<main class="app">
  <header>
    <div>
      <h1>책책책 <span class="title-emoji">📖</span></h1>
      <div class="sub">오늘도 한 권, 차곡차곡. · v2.4</div>
    </div>
    <div class="header-actions">
      <div class="count-wrap">
        <div class="count" id="monthCount">이번 달 0권</div>
        <div class="count total" id="count">총 0권</div>
      </div>
      <button class="gear-btn" id="settingsBtn" aria-label="설정">⚙︎</button>
    </div>
  </header>

  <div class="search-row">
    <input id="bookSearch" placeholder="어떤 책을 읽었나요?" autocomplete="off" />
    <button class="search-btn" id="searchBtn">검색</button>
  </div>
  <div class="search-results" id="searchResults"></div>

  <section class="monthly-panel">
    <button class="month-toggle" id="monthToggle" type="button" aria-expanded="false">
      <span>월별 책더미</span>
      <span id="monthToggleIcon">⌄</span>
    </button>
    <div class="monthly-section" id="monthlySection" hidden>
      <div class="month-scroll" id="monthScroll">
        <div class="month-chart" id="monthChart"></div>
      </div>
    </div>
  </section>

  <section class="stack-shell">
    <div class="stack-label-row"><div class="stack-label">내 책더미</div><button class="history-btn" id="historyBtn" type="button">🔎 읽은 책 찾기</button></div>
    <div class="stack-viewport" id="stackViewport">
      <section class="stack-wrap">
      <div class="stack" id="stack"></div>
      </section>
    </div>
  </section>
</main>

<button class="fab" id="addBtn">＋ 책 쌓기</button>

<div class="sheet-bg" id="editorBg">
  <section class="sheet" role="dialog" aria-modal="true">
    <div class="handle"></div>
    <h2 id="editorTitle">책 추가</h2>
    <input type="hidden" id="bookId">
    <div class="field"><label for="title">책 제목</label><input id="title"></div>
    <div class="grid">
      <div class="field"><label for="author">저자</label><input id="author"></div>
      <div class="field"><label for="pages">쪽수</label><input id="pages" type="number" min="1" inputmode="numeric" placeholder="자동 조회 · 없으면 직접 입력"></div>
    </div>
    <input id="cover" type="hidden">
    <div class="grid">
      <div class="field">
        <label for="date">읽은 날짜</label>
        <input id="date" type="date">
      </div>
      <div class="field">
        <label>별점</label>
        <input id="rating" type="hidden" value="">
        <div class="rating-picker" id="ratingPicker" aria-label="별점 선택">
          <div class="star-wrap"><div class="star-bg">★</div><div class="star-fill">★</div><button type="button" class="half-left" data-rating="0.5" aria-label="0.5점"></button><button type="button" class="half-right" data-rating="1" aria-label="1점"></button></div>
          <div class="star-wrap"><div class="star-bg">★</div><div class="star-fill">★</div><button type="button" class="half-left" data-rating="1.5" aria-label="1.5점"></button><button type="button" class="half-right" data-rating="2" aria-label="2점"></button></div>
          <div class="star-wrap"><div class="star-bg">★</div><div class="star-fill">★</div><button type="button" class="half-left" data-rating="2.5" aria-label="2.5점"></button><button type="button" class="half-right" data-rating="3" aria-label="3점"></button></div>
          <div class="star-wrap"><div class="star-bg">★</div><div class="star-fill">★</div><button type="button" class="half-left" data-rating="3.5" aria-label="3.5점"></button><button type="button" class="half-right" data-rating="4" aria-label="4점"></button></div>
          <div class="star-wrap"><div class="star-bg">★</div><div class="star-fill">★</div><button type="button" class="half-left" data-rating="4.5" aria-label="4.5점"></button><button type="button" class="half-right" data-rating="5" aria-label="5점"></button></div>
          <span class="rating-value" id="ratingValue">선택 안 함</span>
        </div>
      </div>
    </div>
    <div class="reread-history" id="rereadHistory" hidden></div>
    <div class="field"><label for="review">간단 독후감</label><textarea id="review" placeholder="이번에 읽고 남은 생각을 적어보세요."></textarea></div>
    <div class="actions">
      <button class="btn secondary" id="cancelBtn">취소</button>
      <button class="btn primary" id="saveBtn">저장</button>
    </div>
  </section>
</div>

<div class="detail-bg" id="detailBg">
  <section class="detail-card" role="dialog" aria-modal="true" aria-label="책 상세">
    <button class="detail-close" id="closeDetail" type="button" aria-label="닫기">×</button>
    <div class="detail-scroll" id="detailContent"></div>
    <div class="detail-actions">
      <button class="detail-btn edit" id="editDetail" type="button">수정</button>
      <button class="detail-btn delete" id="deleteDetail" type="button">삭제</button>
    </div>
  </section>
</div>


<div class="detail-bg" id="rereadBg">
  <section class="reread-card" role="dialog" aria-modal="true" aria-label="다시 읽기">
    <button class="detail-close" id="closeReread" type="button" aria-label="닫기">×</button>
    <div class="reread-title">전에 읽은 책이에요 📖</div>
    <div class="reread-sub" id="rereadSub"></div>
    <div class="reread-prev" id="rereadPrev"></div>
    <div class="reread-actions">
      <button class="detail-btn" id="viewPrevious" type="button">이전 기록 보기</button>
      <button class="detail-btn edit" id="startReread" type="button">다시 읽기</button>
    </div>
  </section>
</div>

<div class="detail-bg" id="libraryBg">
  <section class="library-card" role="dialog" aria-modal="true" aria-label="읽은 책">
    <div class="library-head">
      <div>
        <div class="library-title" id="libraryTitle">읽은 책 찾기</div>
        <div class="library-sub" id="librarySub"></div>
      </div>
      <button class="detail-close static" id="closeLibrary" type="button" aria-label="닫기">×</button>
    </div>
    <div class="library-tabs" id="libraryTabs">
      <button class="lib-tab active" data-mode="all" type="button">전체</button>
      <button class="lib-tab" data-mode="reread" type="button">다독한 책 🔁</button>
    </div>
    <div class="library-search">
      <input id="historySearch" placeholder="제목이나 저자로 검색" autocomplete="off">
    </div>
    <div class="library-list" id="libraryList"></div>
  </section>
</div>

<div class="sheet-bg" id="settingsBg">
  <section class="sheet" role="dialog" aria-modal="true">
    <div class="handle"></div>
    <h2>설정</h2>

    <div class="section-card">
      <div class="section-title">백업 / 복원</div>
      <div class="section-text">
        책 기록을 JSON 파일로 백업하고 다시 불러올 수 있어요. API 키는 보안을 위해 백업 파일에 포함하지 않아요.
      </div>
      <div class="actions">
        <button class="btn secondary" id="importBtn">백업 불러오기</button>
        <button class="btn primary" id="exportBtn">백업 저장</button>
      </div>
      <input class="file-input" id="importFile" type="file" accept=".json,application/json">
      <div class="status" id="backupStatus"></div>
    </div>

    <div class="actions">
      <button class="btn secondary" id="closeSettings">닫기</button>
    </div>
  </section>
</div>

<script>
(function(){
  const STORAGE_KEY="myBookStack.v2";
  const PASTELS=["#F6C6D0","#F8D8B6","#F7E8A4","#CDECCF","#CBE6F6","#D9D0F2","#E7C9E8","#D6E6D5"];
  const COLORS=["#8b6953","#586f72","#7a687f","#9b6b62","#747b57","#4f687b","#8d7756","#765d5d","#62735f","#665c78"];
  const $=id=>document.getElementById(id);
  let activeDetailId=null;

  function loadBooks(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY))||[]}catch(e){return[]}}
  function saveBooks(v){localStorage.setItem(STORAGE_KEY,JSON.stringify(v))}
  function esc(v=""){return String(v).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}
  function clamp(n,min,max){return Math.max(min,Math.min(max,n))}
  function hash(str){let h=0;for(let i=0;i<str.length;i++)h=(h*31+str.charCodeAt(i))>>>0;return h}
  function setRating(value){
    const v=Math.max(0,Math.min(5,Number(value)||0));
    $("rating").value=v ? String(v) : "";
    const fills=document.querySelectorAll("#ratingPicker .star-fill");
    fills.forEach((fill,i)=>{
      const starStart=i;
      const amount=Math.max(0,Math.min(1,v-starStart));
      const right=(1-amount)*100; fill.style.clipPath=`inset(0 ${right}% 0 0)`; fill.style.webkitClipPath=`inset(0 ${right}% 0 0)`;
    });
    $("ratingValue").textContent=v ? v.toFixed(1)+"점" : "선택 안 함";
  }
  function renderRatingText(value){
    const v=Math.max(0,Math.min(5,Number(value)||0));
    if(!v) return "별점 없음";
    const full=Math.floor(v);
    const half=(v-full)>=0.5;
    return "★".repeat(full)+(half?"◐":"")+"☆".repeat(5-full-(half?1:0))+"  "+v.toFixed(1);
  }
  function size(book){
    const p=Number(book.pages)||250;
    {
    const pp=Math.max(1,Number(p)||300);
    const height=pp<=150?29:pp<=300?34:pp<=500?39:pp<=800?45:49;
    return {height,width:clamp(60+(hash(book.title)%19),60,78)};
  }
  }
  function monthKey(dateStr){
    if(!dateStr) return "";
    const d=new Date(dateStr+"T00:00:00");
    if(Number.isNaN(d.getTime())) return "";
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
  }
  function renderMonthly(books){
    const now=new Date();
    const currentKey=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}`;
    const counts={};
    books.forEach(b=>{
      const k=monthKey(b.date);
      if(k) counts[k]=(counts[k]||0)+1;
    });
    const currentCount=counts[currentKey]||0;
    $("monthCount").textContent=`이번 달 ${currentCount}권`;

    const keys=Object.keys(counts).sort();
    const first=keys[0]||currentKey;
    const [fy,fm]=first.split("-").map(Number);
    const [cy,cm]=currentKey.split("-").map(Number);
    const months=[];
    let y=fy,m=fm;
    while(y<cy || (y===cy && m<=cm)){
      months.push(`${y}-${String(m).padStart(2,"0")}`);
      m++; if(m===13){m=1;y++}
    }
    if(!months.length) months.push(currentKey);

    const chart=$("monthChart"); chart.innerHTML="";
    months.forEach(k=>{
      const c=counts[k]||0;
      const [yy,mm]=k.split("-");
      const col=document.createElement("button"); col.type="button"; col.className="month-col"; col.dataset.month=k;
      const mini=document.createElement("div"); mini.className="mini-stack";
      for(let i=0;i<c;i++){
        const b=document.createElement("div"); b.className="mini-book";
        b.style.width=(38+(i%4)*4)+"px";
        b.style.background=PASTELS[i%PASTELS.length];
        mini.appendChild(b);
      }
      col.appendChild(mini);
      const years=new Set(months.map(x=>x.split("-")[0]));
      const name=document.createElement("div"); name.className="month-name";
      name.textContent=years.size>1 ? `${yy}. ${Number(mm)}월` : `${Number(mm)}월`;
      const num=document.createElement("div"); num.className="month-num"; num.textContent=`${c}권`;
      col.appendChild(name); col.appendChild(num);
      col.addEventListener("click",()=>openLibrary(k));
      chart.appendChild(col);
    });

  }
  function positionLatestBook(){
    const vp=$("stackViewport");
    const latest=$("stack")?.lastElementChild;
    if(!vp || !latest) return;
    requestAnimationFrame(()=>{
      const vpRect=vp.getBoundingClientRect();
      const bRect=latest.getBoundingClientRect();
      const currentTop=bRect.top-vpRect.top+vp.scrollTop;
      const targetTop=vp.clientHeight*0.30;
      vp.scrollTop=Math.max(0,currentTop-targetTop);
    });
  }
  function normalizeText(v){
    return String(v||"").toLowerCase().replace(/\s+/g,"").replace(/[^\p{L}\p{N}]/gu,"");
  }
  function canonicalKey(book){
    if(book?.isbn13) return "isbn:"+String(book.isbn13).trim();
    return "txt:"+normalizeText(book?.title)+"|"+normalizeText(book?.author);
  }
  function readingsFor(book){
    const key=canonicalKey(book);
    return loadBooks().filter(b=>canonicalKey(b)===key)
      .sort((a,b)=>(a.date||"").localeCompare(b.date||"") || (a.createdAt||0)-(b.createdAt||0));
  }
  function readingNumber(book){
    const arr=readingsFor(book);
    const i=arr.findIndex(b=>b.id===book.id);
    return i>=0 ? i+1 : 1;
  }
  function render(){
    const books=loadBooks(); $("count").textContent="총 "+books.length+"권"; renderMonthly(books); $("stack").innerHTML="";
    if(!books.length){$("stack").innerHTML='<div class="empty"><strong>아직 쌓인 책이 없어요.</strong>책을 추가하면 실제 책 커버 느낌으로 한 권씩 쌓여요.</div>';return}
    books.forEach(book=>{
      const s=size(book), b=document.createElement("button");
      b.className="book";
      b.style.height=s.height+"px"; b.style.width=s.width+"%";
      const fallback=book.color||COLORS[hash(book.title)%COLORS.length];
      b.style.background=fallback;
      if(book.cover){
        const safeCover=String(book.cover).replace(/["\\]/g,"");
        b.style.backgroundImage=`url("${safeCover}")`;
        b.style.backgroundSize="cover";
        b.style.backgroundPosition="center center";
      }
      b.style.borderRadius=Math.max(6,s.height*.16)+"px";
      b.style.transform="none";
      b.style.marginLeft="auto";
      b.style.marginRight="auto";
      b.innerHTML='<span class="book-title">'+esc(book.title)+'</span>';
      b.addEventListener("click",()=>openDetail(book.id));
      $("stack").appendChild(b);
    });
    positionLatestBook();
  }

  let libraryFilterMonth=null;
  let libraryMode="all";

  function monthLabel(k){
    if(!k) return "";
    const [y,m]=k.split("-");
    return `${Number(m)}월`;
  }

  function renderLibraryList(){
    const all=loadBooks();
    const q=$("historySearch").value.trim().toLowerCase();
    let books=libraryFilterMonth ? all.filter(b=>monthKey(b.date)===libraryFilterMonth) : all.slice();
    if(libraryMode==="reread"){
      const counts={}; all.forEach(b=>{const k=canonicalKey(b);counts[k]=(counts[k]||0)+1});
      const seen=new Set();
      books=books.filter(b=>{
        const k=canonicalKey(b);
        if(counts[k]<2 || seen.has(k)) return false;
        seen.add(k); return true;
      });
    }
    books=books.sort((a,b)=>(b.date||"").localeCompare(a.date||"") || (b.createdAt||0)-(a.createdAt||0));
    if(q){
      books=books.filter(b=>
        String(b.title||"").toLowerCase().includes(q) ||
        String(b.author||"").toLowerCase().includes(q)
      );
    }
    const list=$("libraryList"); list.innerHTML="";
    if(!books.length){
      list.innerHTML='<div class="history-empty">해당하는 책이 없어요.</div>';
      return;
    }
    books.forEach(book=>{
      const row=document.createElement("button"); row.type="button"; row.className="history-item";
      row.innerHTML=`${book.cover?`<img class="history-cover" src="${esc(book.cover)}" alt="">`:'<div class="history-cover"></div>'}
        <div><div class="history-title">${esc(book.title)}</div>
        <div class="history-meta">${book.author?esc(book.author):""}${book.date?" · "+esc(book.date):""}${readingsFor(book).length>1?" · "+readingsFor(book).length+"회 읽음":""}</div></div>`;
      row.addEventListener("click",()=>{ closeLibrary(); openDetail(book.id); });
      list.appendChild(row);
    });
  }

  function openLibrary(month=null){
    libraryFilterMonth=month;
    libraryMode="all";
    document.querySelectorAll(".lib-tab").forEach(t=>t.classList.toggle("active",t.dataset.mode==="all"));
    const all=loadBooks();
    const scoped=month ? all.filter(b=>monthKey(b.date)===month) : all;
    $("libraryTitle").textContent=month ? `${monthLabel(month)}에 읽은 책` : "읽은 책 찾기";
    $("librarySub").textContent=month ? `${scoped.length}권` : `총 ${all.length}권`;
    $("historySearch").value="";
    $("libraryBg").classList.add("open");
    renderLibraryList();
  }

  function closeLibrary(){
    $("libraryBg").classList.remove("open");
    libraryFilterMonth=null;
  }

  let pendingRereadDraft=null;
  let pendingPrevious=[];

  function handleBookSelection(draft){
    const prev=loadBooks().filter(b=>canonicalKey(b)===canonicalKey(draft));
    if(!prev.length){ openEditor(draft); return; }
    pendingRereadDraft=draft;
    pendingPrevious=prev.sort((a,b)=>(a.date||"").localeCompare(b.date||""));
    $("rereadSub").textContent=`${draft.title} · 지금까지 ${prev.length}회 읽었어요.`;
    $("rereadPrev").innerHTML=pendingPrevious.map((r,i)=>`
      <div class="reread-prev-item">
        <div class="reread-prev-head">${i+1}회차 · ${esc(r.date||"날짜 없음")} ${r.rating?"· ★ "+esc(r.rating):""}</div>
        <div class="reread-prev-review">${esc(r.review||"독후감 없음")}</div>
      </div>`).join("");
    $("rereadBg").classList.add("open");
  }

  function closeReread(){ $("rereadBg").classList.remove("open"); }

  function openEditor(book){
    document.body.style.overflow="hidden"; $("editorBg").classList.add("open");
    $("editorTitle").textContent=book?"책 기록 수정":"책 추가";
    $("bookId").value=book?.id||""; $("title").value=book?.title||""; $("author").value=book?.author||"";
    $("pages").value=book?.pages||""; $("cover").value=book?.cover||"";
    $("date").value=book?.date||new Date().toISOString().slice(0,10);
    setRating(book?.rating??""); $("review").value=book?.review||"";
    const historyBox=$("rereadHistory");
    const prev=(book&&book._previousReadings)||[];
    if(prev.length){
      historyBox.hidden=false;
      historyBox.innerHTML='<div class="reread-history-title">이전에 남긴 기록</div>'+
        prev.map((r,i)=>`<div class="reread-history-item"><b>${i+1}회차 · ${esc(r.date||"날짜 없음")} · ${r.rating?esc(r.rating)+"점":"별점 없음"}</b><br>${esc(r.review||"독후감 없음")}</div>`).join("");
    }else{
      historyBox.hidden=true; historyBox.innerHTML="";
    }
  }
  function closeEditor(){$("editorBg").classList.remove("open");document.body.style.overflow=""}
  function saveEditor(){
    const title=$("title").value.trim(); if(!title){alert("책 제목을 입력해주세요.");return}
    const id=$("bookId").value; let books=loadBooks();
    const old=books.find(b=>b.id===id)||{};
    const data={
      id:id||("b"+Date.now()+Math.random().toString(16).slice(2)),
      title,author:$("author").value.trim(),pages:Number($("pages").value)||0,
      cover:$("cover").value.trim(),date:$("date").value,rating:$("rating").value,
      review:$("review").value.trim(),isbn13:old.isbn13||"",aladinLink:old.aladinLink||"",createdAt:old.createdAt||Date.now()
    };
    books=id?books.map(b=>b.id===id?{...b,...data}:b):[...books,data];
    saveBooks(books);closeEditor();render();
  }

  function openDetail(id){
    const book=loadBooks().find(b=>b.id===id); if(!book)return; activeDetailId=id;
    document.body.style.overflow="hidden"; $("detailBg").classList.add("open");
    $("detailContent").innerHTML=`
      <div class="detail-head">
        ${book.cover?`<img class="cover" src="${esc(book.cover)}" alt="">`:'<div class="cover"></div>'}
        <div class="detail-meta"><div class="detail-title">${esc(book.title)}${readingsFor(book).length>1?` <span style="font-size:11px;color:#7d8b93;font-weight:700">· ${readingsFor(book).length}회 읽음</span>`:""}</div>
        <div class="meta">${book.author?esc(book.author)+"<br>":""}${book.pages?book.pages.toLocaleString()+"쪽<br>":""}${book.date?`${readingsFor(book).length>1?readingNumber(book)+"회차 · ":""}${esc(book.date)}<br>`:""}
        <span class="stars">${book.rating?renderRatingText(book.rating):"별점 없음"}</span></div></div>
      </div>
      <label>독후감</label><div class="review-box">${esc(book.review||"아직 작성한 독후감이 없어요.")}</div>`;
  }
  function closeDetail(){$("detailBg").classList.remove("open");document.body.style.overflow="";activeDetailId=null}

  async function searchBooks(){
    const q=$("bookSearch").value.trim(); if(!q)return;
    const box=$("searchResults");
    box.classList.add("open");
    box.innerHTML='<div class="result-note">📖 알라딘에서 책을 찾고 있어요…</div>';

    try{
      const workerUrl="https://old-brook-92fd.leegh1310.workers.dev/search?q="+encodeURIComponent(q);
      const res=await fetch(workerUrl);
      if(!res.ok) throw new Error("HTTP "+res.status);

      const data=await res.json();
      if(data.error) throw new Error(data.error);

      const items=data.books||[];
      if(!items.length){
        box.innerHTML='<div class="result-note">검색 결과가 없어요.</div>';
        return;
      }

      box.innerHTML="";
      items.forEach(item=>{
        const img=(item.cover||"").replace(/^http:/,"https:");
        const pageCount=Number(item.pages||0);
        const btn=document.createElement("button");
        btn.className="result";
        btn.innerHTML=`${img?`<img src="${esc(img)}" alt="">`:'<div style="width:46px;aspect-ratio:2/3;background:#eee;border-radius:6px"></div>'}
          <div><div class="rtitle">${esc(item.title||"제목 없음")}</div>
          <div class="rmeta">${esc(item.author||"")}${pageCount?" · "+pageCount+"쪽":""}${item.publisher?"<br>"+esc(item.publisher):""}</div></div>`;
        btn.addEventListener("click",async()=>{
          box.classList.remove("open");
          let pages=pageCount||0;
          let detail=item;
          if(item.isbn13){
            try{
              const detailRes=await fetch("https://old-brook-92fd.leegh1310.workers.dev/detail?isbn="+encodeURIComponent(item.isbn13));
              if(detailRes.ok){
                const d=await detailRes.json();
                if(d.book){ detail=d.book; pages=Number(d.book.pages||pages||0); }
              }
            }catch(e){}
          }
          const draft={
            title:detail.title||item.title||"",
            author:detail.author||item.author||"",
            pages:pages||0,
            cover:(detail.cover||img||"").replace(/^http:/,"https:"),
            date:new Date().toISOString().slice(0,10),
            rating:"",
            review:"",
            isbn13:detail.isbn13||item.isbn13||"",
            aladinLink:detail.link||item.link||""
          };
          handleBookSelection(draft);
        });
        box.appendChild(btn);
      });
    }catch(e){
      box.innerHTML='<div class="result-note">검색 연결에 실패했어요. 잠시 후 다시 시도해주세요.</div>';
    }
  }

  $("addBtn").addEventListener("click",()=>openEditor());
  $("cancelBtn").addEventListener("click",closeEditor);
  $("saveBtn").addEventListener("click",saveEditor);
  $("closeDetail").addEventListener("click",closeDetail);
  $("editDetail").addEventListener("click",()=>{
    const book=loadBooks().find(b=>b.id===activeDetailId); if(!book)return; closeDetail();openEditor(book)
  });
  $("deleteDetail").addEventListener("click",()=>{
    if(!activeDetailId||!confirm("이 책 기록을 삭제할까요?"))return;
    saveBooks(loadBooks().filter(b=>b.id!==activeDetailId));closeDetail();render()
  });
  $("editorBg").addEventListener("click",e=>{if(e.target===$("editorBg"))closeEditor()});
  $("detailBg").addEventListener("click",e=>{if(e.target===$("detailBg"))closeDetail()});
  document.querySelectorAll("#ratingPicker button[data-rating]").forEach(btn=>{
    btn.addEventListener("click",()=>setRating(btn.dataset.rating));
  });
  $("ratingPicker").addEventListener("dblclick",()=>setRating(0));
  $("monthToggle").addEventListener("click",()=>{
    const section=$("monthlySection");
    const opening=section.hidden;
    section.hidden=!opening;
    $("monthToggle").setAttribute("aria-expanded", opening ? "true" : "false");
    $("monthToggleIcon").textContent=opening ? "⌃" : "⌄";
    if(opening){
      requestAnimationFrame(()=>{ $("monthScroll").scrollLeft=$("monthScroll").scrollWidth; });
    }
  });
  $("historyBtn").addEventListener("click",()=>openLibrary());
  $("closeLibrary").addEventListener("click",closeLibrary);
  $("libraryBg").addEventListener("click",e=>{if(e.target===$("libraryBg"))closeLibrary()});
  $("historySearch").addEventListener("input",renderLibraryList);
  $("closeReread").addEventListener("click",()=>{closeReread();pendingRereadDraft=null;pendingPrevious=[]});
  $("rereadBg").addEventListener("click",e=>{if(e.target===$("rereadBg"))closeReread()});
  $("startReread").addEventListener("click",()=>{
    if(!pendingRereadDraft)return;
    const draft={...pendingRereadDraft,_previousReadings:pendingPrevious};
    closeReread(); openEditor(draft);
  });
  $("viewPrevious").addEventListener("click",()=>{
    if(!pendingPrevious.length)return;
    const id=pendingPrevious[pendingPrevious.length-1].id;
    closeReread(); openDetail(id);
  });
  document.querySelectorAll(".lib-tab").forEach(tab=>{
    tab.addEventListener("click",()=>{
      libraryMode=tab.dataset.mode||"all";
      document.querySelectorAll(".lib-tab").forEach(t=>t.classList.toggle("active",t===tab));
      renderLibraryList();
    });
  });
  $("searchBtn").addEventListener("click",searchBooks);
  $("bookSearch").addEventListener("keydown",e=>{if(e.key==="Enter")searchBooks()});

  function openSettings(){
    document.body.style.overflow="hidden";
    $("settingsBg").classList.add("open");
  }
  function closeSettings(){
    $("settingsBg").classList.remove("open");
    document.body.style.overflow="";
  }

  $("settingsBtn").addEventListener("click",openSettings);
  $("closeSettings").addEventListener("click",closeSettings);
  $("settingsBg").addEventListener("click",e=>{if(e.target===$("settingsBg"))closeSettings()});

  $("exportBtn").addEventListener("click",()=>{
    const payload={
      app:"책책책",
      version:"2.4",
      exportedAt:new Date().toISOString(),
      books:loadBooks()
    };
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    const d=new Date();
    const stamp=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    a.href=url;
    a.download=`책책책_백업_${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    $("backupStatus").textContent="백업 파일을 저장했어요.";
  });

  $("importBtn").addEventListener("click",()=>$("importFile").click());

  $("importFile").addEventListener("change",async(e)=>{
    const file=e.target.files?.[0];
    if(!file)return;
    try{
      const text=await file.text();
      const data=JSON.parse(text);
      const books=Array.isArray(data)?data:data.books;
      if(!Array.isArray(books))throw new Error("형식 오류");
      if(!confirm(`백업에서 ${books.length}권을 불러올까요? 현재 기록은 백업 내용으로 교체돼요.`)){
        e.target.value="";
        return;
      }
      saveBooks(books);
      render();
      $("backupStatus").textContent=`${books.length}권을 복원했어요.`;
    }catch(err){
      $("backupStatus").textContent="백업 파일을 읽지 못했어요. 올바른 JSON 백업 파일인지 확인해주세요.";
    }
    e.target.value="";
  });

  render();
})();
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function() {
    navigator.serviceWorker.register("./sw.js?v=2.4").then(function(r){r.update();}).catch(function(){});
  });
}
</script>
